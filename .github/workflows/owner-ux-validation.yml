name: Owner UX Validation

on:
  push:
    branches:
      - integration/owner-ux-20260907
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # @supabase/ssr and @supabase/supabase-js declare engines node >=22.
          # Node 20 installed with an engine warning and could break on a patch
          # release that starts relying on a 22-only API.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
